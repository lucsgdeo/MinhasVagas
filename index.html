<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinhasVagas - Vagas de Tecnologia</title>
    <script>
        // Aplica o modo salvo antes da pintura para evitar flash claro/escuro.
        try {
            var modo = localStorage.getItem('minhasvagas_mode');
            if (!modo && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                modo = 'dark';
            }
            if (modo === 'dark') document.documentElement.setAttribute('data-mode', 'dark');
        } catch (e) {}
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/apresentacao/main.tsx"></script>
</body>
</html>
