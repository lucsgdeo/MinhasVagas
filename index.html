<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinhasVagas - Dashboard de Vagas Gupy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">MinhasVagas</h1>
                <p class="text-gray-600 mt-1">Dashboard de vagas do Gupy</p>
            </div>
            <button id="sync-btn" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg transition-colors flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <span>Sincronizar Agora</span>
            </button>
        </header>

        <!-- Sync Modal -->
        <div id="sync-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
            <div class="bg-white rounded-xl p-6 max-w-md w-full mx-4">
                <h3 class="text-xl font-semibold mb-4">Disparar Sincronização Manual</h3>
                <p class="text-gray-600 mb-4">Insira seu GitHub Personal Access Token (PAT) com permissão <code>repo</code> e <code>workflow</code>:</p>
                <input type="password" id="pat-input" placeholder="ghp_xxxxxxxxxxxx" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent mb-4">
                <div id="sync-feedback" class="mb-4 hidden"></div>
                <div class="flex gap-3">
                    <button id="sync-confirm" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg font-medium transition-colors">Disparar</button>
                    <button id="sync-cancel" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 py-2 px-4 rounded-lg font-medium transition-colors">Cancelar</button>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="mb-6">
            <div class="flex border-b border-gray-200" role="tablist">
                <button id="tab-24h" role="tab" aria-selected="true" class="tab-btn px-6 py-3 font-medium text-sm border-b-2 border-blue-600 text-blue-600">Últimas 24 Horas</button>
                <button id="tab-7d" role="tab" aria-selected="false" class="tab-btn px-6 py-3 font-medium text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700">Últimos 7 Dias</button>
            </div>
        </div>

        <!-- Filters -->
        <div class="mb-6 flex flex-wrap gap-2">
            <input type="text" id="search-input" placeholder="Buscar por título..." class="flex-1 min-w-[200px] px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
            <div class="flex flex-wrap gap-2" id="filter-pills">
                <button class="filter-pill active px-4 py-2 bg-blue-600 text-white text-sm rounded-full" data-filter="todas">Todas</button>
                <button class="filter-pill px-4 py-2 bg-gray-100 text-gray-700 text-sm rounded-full hover:bg-gray-200" data-filter="remoto">100% Remoto</button>
                <button class="filter-pill px-4 py-2 bg-gray-100 text-gray-700 text-sm rounded-full hover:bg-gray-200" data-filter="presencial">Presencial</button>
                <button class="filter-pill px-4 py-2 bg-gray-100 text-gray-700 text-sm rounded-full hover:bg-gray-200" data-filter="suporte">Suporte</button>
                <button class="filter-pill px-4 py-2 bg-gray-100 text-gray-700 text-sm rounded-full hover:bg-gray-200" data-filter="ti">TI</button>
                <button class="filter-pill px-4 py-2 bg-gray-100 text-gray-700 text-sm rounded-full hover:bg-gray-200" data-filter="infraestrutura">Infraestrutura</button>
                <button class="filter-pill px-4 py-2 bg-gray-100 text-gray-700 text-sm rounded-full hover:bg-gray-200" data-filter="service-desk">Service Desk</button>
                <button class="filter-pill px-4 py-2 bg-gray-100 text-gray-700 text-sm rounded-full hover:bg-gray-200" data-filter="junior">Júnior</button>
                <button class="filter-pill px-4 py-2 bg-gray-100 text-gray-700 text-sm rounded-full hover:bg-gray-200" data-filter="help-desk">Help Desk</button>
            </div>
        </div>

        <!-- Stats -->
        <div id="stats" class="mb-4 flex flex-wrap gap-4 text-sm text-gray-600 hidden">
            <span id="stat-total"></span>
            <span id="stat-remoto"></span>
            <span id="stat-presencial"></span>
        </div>

        <!-- Vacancies Grid -->
        <div id="vacancies-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <!-- Cards will be inserted here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-12">
            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            <h3 class="mt-2 text-lg font-medium text-gray-900">Nenhuma vaga encontrada</h3>
            <p class="mt-1 text-gray-500">Tente ajustar os filtros ou a busca</p>
        </div>

        <!-- Loading -->
        <div id="loading" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            <p class="mt-2 text-gray-600">Carregando vagas...</p>
        </div>

        <!-- Error -->
        <div id="error-state" class="hidden text-center py-12">
            <svg class="mx-auto h-12 w-12 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
            <h3 class="mt-2 text-lg font-medium text-gray-900">Erro ao carregar vagas</h3>
            <p id="error-message" class="mt-1 text-gray-500"></p>
            <button id="retry-btn" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors">Tentar novamente</button>
        </div>
    </div>

    <script>
        // State
        let allVagas = [];
        let currentTab = '24h';
        let currentFilter = 'todas';
        let searchTerm = '';

        // DOM Elements
        const tab24h = document.getElementById('tab-24h');
        const tab7d = document.getElementById('tab-7d');
        const searchInput = document.getElementById('search-input');
        const filterPills = document.querySelectorAll('.filter-pill');
        const vacanciesGrid = document.getElementById('vacancies-grid');
        const emptyState = document.getElementById('empty-state');
        const loading = document.getElementById('loading');
        const errorState = document.getElementById('error-state');
        const errorMessage = document.getElementById('error-message');
        const retryBtn = document.getElementById('retry-btn');
        const stats = document.getElementById('stats');
        const statTotal = document.getElementById('stat-total');
        const statRemoto = document.getElementById('stat-remoto');
        const statPresencial = document.getElementById('stat-presencial');
        const syncBtn = document.getElementById('sync-btn');
        const syncModal = document.getElementById('sync-modal');
        const patInput = document.getElementById('pat-input');
        const syncConfirm = document.getElementById('sync-confirm');
        const syncCancel = document.getElementById('sync-cancel');
        const syncFeedback = document.getElementById('sync-feedback');

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            loadVagas();
            setupEventListeners();
        });

        function setupEventListeners() {
            // Tabs
            tab24h.addEventListener('click', () => switchTab('24h'));
            tab7d.addEventListener('click', () => switchTab('7d'));

            // Search
            searchInput.addEventListener('input', (e) => {
                searchTerm = e.target.value.toLowerCase();
                renderVagas();
            });

            // Filter pills
            filterPills.forEach(pill => {
                pill.addEventListener('click', () => {
                    filterPills.forEach(p => {
                        p.classList.remove('active', 'bg-blue-600', 'text-white');
                        p.classList.add('bg-gray-100', 'text-gray-700');
                    });
                    pill.classList.add('active', 'bg-blue-600', 'text-white');
                    pill.classList.remove('bg-gray-100', 'text-gray-700');
                    currentFilter = pill.dataset.filter;
                    renderVagas();
                });
            });

            // Sync modal
            syncBtn.addEventListener('click', () => {
                syncModal.classList.remove('hidden');
                syncModal.classList.add('flex');
                patInput.focus();
            });

            syncCancel.addEventListener('click', closeSyncModal);
            syncModal.addEventListener('click', (e) => {
                if (e.target === syncModal) closeSyncModal();
            });

            syncConfirm.addEventListener('click', triggerWorkflow);
            patInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') triggerWorkflow();
            });

            retryBtn.addEventListener('click', loadVagas);
        }

        function closeSyncModal() {
            syncModal.classList.add('hidden');
            syncModal.classList.remove('flex');
            patInput.value = '';
            syncFeedback.classList.add('hidden');
            syncFeedback.textContent = '';
            syncFeedback.className = 'mb-4 hidden';
        }

        async function triggerWorkflow() {
            const pat = patInput.value.trim();
            if (!pat) {
                showFeedback('Por favor, insira o PAT', 'error');
                return;
            }

            syncConfirm.disabled = true;
            syncConfirm.textContent = 'Disparando...';
            showFeedback('Enviando requisição...', 'info');

            try {
                const response = await fetch('https://api.github.com/repos/lucas/MinhasVagas/actions/workflows/main.yml/dispatches', {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${pat}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ ref: 'main' })
                });

                if (response.status === 204) {
                    showFeedback('✅ Workflow disparado com sucesso!', 'success');
                    setTimeout(closeSyncModal, 2000);
                } else {
                    const error = await response.json();
                    showFeedback(`❌ Erro: ${error.message || response.status}`, 'error');
                }
            } catch (err) {
                showFeedback(`❌ Erro de rede: ${err.message}`, 'error');
            } finally {
                syncConfirm.disabled = false;
                syncConfirm.textContent = 'Disparar';
            }
        }

        function showFeedback(msg, type) {
            syncFeedback.textContent = msg;
            syncFeedback.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800', 'bg-blue-100', 'text-blue-800');
            if (type === 'success') syncFeedback.classList.add('bg-green-100', 'text-green-800');
            else if (type === 'error') syncFeedback.classList.add('bg-red-100', 'text-red-800');
            else syncFeedback.classList.add('bg-blue-100', 'text-blue-800');
            syncFeedback.classList.add('px-4', 'py-2', 'rounded-lg', 'text-sm');
        }

        function switchTab(tab) {
            currentTab = tab;
            if (tab === '24h') {
                tab24h.classList.add('border-blue-600', 'text-blue-600');
                tab24h.classList.remove('border-transparent', 'text-gray-500');
                tab24h.setAttribute('aria-selected', 'true');
                tab7d.classList.add('border-transparent', 'text-gray-500');
                tab7d.classList.remove('border-blue-600', 'text-blue-600');
                tab7d.setAttribute('aria-selected', 'false');
            } else {
                tab7d.classList.add('border-blue-600', 'text-blue-600');
                tab7d.classList.remove('border-transparent', 'text-gray-500');
                tab7d.setAttribute('aria-selected', 'true');
                tab24h.classList.add('border-transparent', 'text-gray-500');
                tab24h.classList.remove('border-blue-600', 'text-blue-600');
                tab24h.setAttribute('aria-selected', 'false');
            }
            renderVagas();
        }

        async function loadVagas() {
            showLoading(true);
            hideError();
            hideEmpty();

            try {
                const response = await fetch('vagas_recentes.json');
                if (!response.ok) {
                    if (response.status === 404) {
                        allVagas = [];
                        showEmpty();
                        return;
                    }
                    throw new Error(`HTTP ${response.status}`);
                }
                allVagas = await response.json();
                renderVagas();
            } catch (err) {
                console.error('Erro ao carregar vagas:', err);
                showError(`Não foi possível carregar as vagas: ${err.message}`);
            } finally {
                showLoading(false);
            }
        }

        function filterVagas() {
            let filtered = allVagas;

            // Tab filter
            if (currentTab === '24h') {
                const now = new Date();
                const dayAgo = new Date(now.getTime() - 24 * 60 * 60 * 1000);
                filtered = filtered.filter(v => {
                    const pubDate = new Date(v.publishedDate.replace('Z', '+00:00'));
                    return pubDate >= dayAgo;
                });
            }

            // Search filter
            if (searchTerm) {
                filtered = filtered.filter(v =>
                    v.name.toLowerCase().includes(searchTerm)
                );
            }

            // Pill filter
            if (currentFilter !== 'todas') {
                filtered = filtered.filter(v => {
                    const topic = v.topic.toLowerCase();
                    const modalidade = v.workplaceType.toLowerCase();

                    switch (currentFilter) {
                        case 'remoto':
                            return modalidade === 'remote' || modalidade === 'remoto';
                        case 'presencial':
                            return modalidade === 'onsite' || modalidade === 'presencial';
                        case 'suporte':
                            return topic.includes('suporte');
                        case 'ti':
                            return topic.includes('ti');
                        case 'infraestrutura':
                            return topic.includes('infra');
                        case 'service-desk':
                            return topic.includes('service desk');
                        case 'junior':
                            return topic.includes('júnior') || topic.includes('junior');
                        case 'help-desk':
                            return topic.includes('help desk');
                        default:
                            return true;
                    }
                });
            }

            return filtered;
        }

        function renderVagas() {
            const filtered = filterVagas();

            if (filtered.length === 0) {
                vacanciesGrid.innerHTML = '';
                showEmpty();
                hideStats();
                return;
            }

            hideEmpty();
            showStats(filtered);
            vacanciesGrid.innerHTML = filtered.map(vaga => createCard(vaga)).join('');
        }

        function createCard(vaga) {
            const modalidade = vaga.workplaceType || 'N/I';
            const isRemote = modalidade.toLowerCase() === 'remote' || modalidade.toLowerCase() === 'remoto';
            const badgeClass = isRemote ? 'bg-green-100 text-green-800' : 'bg-blue-100 text-blue-800';
            const badgeText = isRemote ? '100% Remoto' : 'Presencial';
            const topic = vaga.topic || 'Geral';
            const dataPub = vaga.data_formatada_br || formatDate(vaga.publishedDate);
            const link = vaga.jobUrl || '#';

            return `
                <article class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow">
                    <div class="p-5">
                        <div class="flex items-start justify-between gap-2 mb-3">
                            <h3 class="font-semibold text-gray-900 text-base line-clamp-2 flex-1">${escapeHtml(vaga.name || 'Sem título')}</h3>
                            <span class="px-2 py-1 text-xs font-medium rounded-full ${badgeClass} whitespace-nowrap shrink-0">${badgeText}</span>
                        </div>
                        <div class="flex items-center gap-2 mb-3">
                            <span class="px-2 py-1 text-xs font-medium bg-gray-100 text-gray-700 rounded-full">${escapeHtml(topic)}</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-500">${escapeHtml(dataPub)}</span>
                            <a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer" class="text-sm font-medium text-blue-600 hover:text-blue-700 transition-colors">Candidatar-se →</a>
                        </div>
                    </div>
                </article>
            `;
        }

        function showStats(vagas) {
            const total = vagas.length;
            const remoto = vagas.filter(v => (v.workplaceType || '').toLowerCase() === 'remote' || (v.workplaceType || '').toLowerCase() === 'remoto').length;
            const presencial = vagas.filter(v => (v.workplaceType || '').toLowerCase() === 'onsite' || (v.workplaceType || '').toLowerCase() === 'presencial').length;

            statTotal.textContent = `${total} vaga${total !== 1 ? 's' : ''} total`;
            statRemoto.textContent = `${remoto} remota${remoto !== 1 ? 's' : ''}`;
            statPresencial.textContent = `${presencial} presencial${presencial !== 1 ? 's' : ''}`;
            stats.classList.remove('hidden');
        }

        function hideStats() {
            stats.classList.add('hidden');
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'N/I';
            try {
                const date = new Date(dateStr.replace('Z', '+00:00'));
                return date.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            } catch {
                return 'Data inválida';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showLoading(show) {
            loading.classList.toggle('hidden', !show);
            vacanciesGrid.classList.toggle('hidden', show);
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorState.classList.remove('hidden');
            vacanciesGrid.classList.add('hidden');
            emptyState.classList.add('hidden');
            hideStats();
        }

        function hideError() {
            errorState.classList.add('hidden');
        }

        function showEmpty() {
            emptyState.classList.remove('hidden');
            vacanciesGrid.classList.add('hidden');
        }

        function hideEmpty() {
            emptyState.classList.add('hidden');
        }
    </script>
</body>
</html>
